<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>কিউআর স্টুডিও</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#161a23;--mu:#5d6577;--ac:#4f46e5;--bd:#dfe3ec}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1220;--card:#191d30;--tx:#eef0f8;--mu:#a2a9c0;--ac:#818cf8;--bd:#2c3250}}
:root[data-theme=dark]{--bg:#0f1220;--card:#191d30;--tx:#eef0f8;--mu:#a2a9c0;--ac:#818cf8;--bd:#2c3250}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Bengali','Kalpurush','SolaimanLipi',system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:920px;margin:auto;padding:14px}
h1{font-size:1.6rem;margin:.2em 0}h2{font-size:1.15rem;margin:.3em 0 .6em}
.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 8px;text-align:center;font:inherit;color:inherit;cursor:pointer;min-height:64px}
.tile b{display:block;font-size:1.5rem}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 16px;min-height:46px;cursor:pointer;font-weight:600}
.btn.o{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.btn.r{background:#dc2626}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:.9rem;margin:10px 0 4px;color:var(--mu)}
input:not([type=color]):not([type=range]):not([type=file]),select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg)}
input[type=color]{width:100%;height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
input[type=range]{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lay{display:grid;gap:14px}@media(min-width:800px){.lay{grid-template-columns:1fr 1fr}.sticky{position:sticky;top:10px;align-self:start}}
#pv{background:#fff;border-radius:12px;padding:8px;text-align:center;min-height:200px;display:flex;align-items:center;justify-content:center}
#pv svg{max-width:100%;height:auto;max-height:420px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:8px 2px;font-size:.72rem;color:var(--mu);cursor:pointer}
nav button b{display:block;font-size:1.3rem}nav button.on{color:var(--ac);font-weight:700}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:8px 14px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;display:none;max-width:90%}
.warn{background:#fef3c7;color:#78350f;border-radius:12px;padding:10px;margin-top:10px}
.ov{position:fixed;inset:0;background:#000a;z-index:30;display:none;align-items:center;justify-content:center;padding:14px}
.ov>div{background:var(--card);border-radius:16px;padding:14px;max-width:420px;width:100%;max-height:90vh;overflow:auto;text-align:center}
.ov svg{max-width:100%;height:auto;background:#fff}
video{width:100%;border-radius:12px;background:#000}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block}:root{padding:0}body{padding:0;background:#fff}}
.item{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
</style></head><body>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('⚠️ সংরক্ষণ করা যায়নি।')}}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}

/* ধরন: [আইকন, নাম, ফিল্ড[key,লেবেল,ধরন,অপশন], পেলোড] */
const T={

wifi:['📶','ওয়াই-ফাই',[['n','ওয়াই-ফাইয়ের নাম'],['p','পাসওয়ার্ড'],['t','নিরাপত্তার ধরন','sel',[['WPA','WPA/WPA2'],['WEP','WEP'],['nopass','পাসওয়ার্ড নেই']]]],d=>'WIFI:T:'+(d.t||'WPA')+';S:'+d.n.replace(/([\\;,:"])/g,'\\$1')+';P:'+(d.p||'').replace(/([\\;,:"])/g,'\\$1')+';;'],
contact:['👤','যোগাযোগ',[['n','নাম'],['o','প্রতিষ্ঠান'],['p','ফোন','tel'],['e','ই-মেইল','email'],['w','ওয়েবসাইট','url'],['a','ঠিকানা']],d=>'BEGIN:VCARD\nVERSION:3.0\nFN:'+d.n+'\nORG:'+(d.o||'')+'\nTEL:'+(d.p||'')+'\nEMAIL:'+(d.e||'')+'\nURL:'+(d.w||'')+'\nADR:;;'+(d.a||'')+';;;;\nEND:VCARD'],
geo:['📍','অবস্থান',[['l','ম্যাপের লিংক অথবা অক্ষাংশ,দ্রাঘিমাংশ']],d=>/^-?\d+(\.\d+)?\s*,\s*-?\d/.test(d.l)?'geo:'+d.l.replace(/\s/g,''):d.l],
sms:['📱','এসএমএস',[['p','ফোন নম্বর','tel'],['m','বার্তা','area']],d=>'SMSTO:'+d.p+':'+(d.m||'')],
event:['📅','অনুষ্ঠান',[['t','অনুষ্ঠানের নাম'],['d','তারিখ ও সময়','datetime-local'],['l','স্থান']],d=>'BEGIN:VEVENT\nSUMMARY:'+d.t+'\nDTSTART:'+(d.d||'').replace(/[-:]/g,'')+'00\nLOCATION:'+(d.l||'')+'\nEND:VEVENT'],
social:['🔗','সামাজিক যোগাযোগমাধ্যম',[['k','মাধ্যম','sel',[['ফেসবুক','ফেসবুক'],['ইউটিউব','ইউটিউব'],['ইনস্টাগ্রাম','ইনস্টাগ্রাম'],['টিকটক','টিকটক'],['হোয়াটসঅ্যাপ','হোয়াটসঅ্যাপ'],['অন্যান্য','অন্যান্য লিংক']]],['u','প্রোফাইল/পেজের লিংক','url']],d=>d.u]
};
const TPL=[
['ব্যবসায়িক',[['ব্যবসায়িক কার্ড','contact','যোগাযোগ সংরক্ষণ করতে স্ক্যান করুন'],['দোকানের কিউআর','web','আমাদের দোকান দেখুন'],['প্রতিষ্ঠানের কিউআর','web','স্ক্যান করে দেখুন'],['গ্রাহক যোগাযোগ','wa','মেসেজ করতে স্ক্যান করুন'],['কাস্টমার সাপোর্ট','tel','সহায়তার জন্য স্ক্যান করুন'],['ব্যবসার লোকেশন','geo','আমাদের অবস্থান']]],
['ব্যক্তিগত',[['ব্যক্তিগত প্রোফাইল','web','আমার প্রোফাইল'],['ডিজিটাল ভিজিটিং কার্ড','contact','আমার যোগাযোগ'],['ব্যক্তিগত যোগাযোগ','tel','কল করতে স্ক্যান করুন'],['পোর্টফোলিও','web','আমার কাজ দেখুন'],['আমার সম্পর্কে','text','আমার সম্পর্কে']]],
['সামাজিক যোগাযোগমাধ্যম',[['ফেসবুক','social','আমাদের ফেসবুক পেজ'],['ইউটিউব','social','আমাদের ইউটিউব চ্যানেল'],['ইনস্টাগ্রাম','social','আমাদের ইনস্টাগ্রাম'],['টিকটক','social','আমাদের টিকটক'],['হোয়াটসঅ্যাপ','wa','হোয়াটসঅ্যাপে মেসেজ করুন'],['সব সামাজিক যোগাযোগমাধ্যম','web','আমাদের সব লিংক']]],
['রেস্টুরেন্ট',[['ডিজিটাল মেনু','web','মেনু দেখতে স্ক্যান করুন'],['খাবারের অর্ডার','web','অর্ডার করতে স্ক্যান করুন'],['টেবিল কিউআর','web','টেবিল থেকে অর্ডার করুন'],['রিভিউ কিউআর','web','আপনার মতামত দিন'],['রেস্টুরেন্টের তথ্য','text','রেস্টুরেন্টের তথ্য']]],
['ওয়াই-ফাই',[['বাসার ওয়াই-ফাই','wifi','ওয়াই-ফাই সংযোগ করতে স্ক্যান করুন'],['অফিস ওয়াই-ফাই','wifi','ওয়াই-ফাই সংযোগ করতে স্ক্যান করুন'],['দোকানের ওয়াই-ফাই','wifi','ওয়াই-ফাই সংযোগ করতে স্ক্যান করুন'],['অতিথিদের ওয়াই-ফাই','wifi','অতিথিদের ওয়াই-ফাই']]],
['পণ্য',[['পণ্যের তথ্য','web','পণ্যের তথ্য দেখুন'],['পণ্যের ওয়েবসাইট','web','ওয়েবসাইট দেখুন'],['পণ্যের অর্ডার','web','অর্ডার করতে স্ক্যান করুন'],['পণ্যের ওয়ারেন্টি','web','ওয়ারেন্টি যাচাই করুন'],['পণ্যের রিভিউ','web','রিভিউ দিন']]],
['অনুষ্ঠান',[['বিয়ের অনুষ্ঠান','event','আমাদের অনুষ্ঠানে আপনাকে আমন্ত্রণ'],['জন্মদিন','event','জন্মদিনের আমন্ত্রণ'],['দাওয়াত','event','আপনাকে দাওয়াত'],['সেমিনার','event','সেমিনারে যোগ দিন'],['অনুষ্ঠান নিবন্ধন','web','নিবন্ধন করতে স্ক্যান করুন'],['আমন্ত্রণপত্র','text','আমন্ত্রণপত্র']]],
['লোকেশন',[['দোকানের অবস্থান','geo','দোকানের অবস্থান'],['অফিসের অবস্থান','geo','অফিসের অবস্থান'],['বাসার অবস্থান','geo','বাসার অবস্থান'],['গুগল ম্যাপ','geo','ম্যাপে দেখুন']]]];
const P=[['আধুনিক',{fg:'#4f46e5',bg:'#ffffff',shape:'rd',corner:.3}],['সাধারণ',{fg:'#000000',bg:'#ffffff',shape:'sq',corner:0}],['প্রফেশনাল',{fg:'#0f3d5e',bg:'#ffffff',shape:'sq',corner:.2}],['প্রিমিয়াম',{fg:'#7c5a10',bg:'#fffaf0',shape:'dot',corner:.5}],['রঙিন',{fg:'#db2777',bg:'#fef3c7',shape:'dot',corner:.5}]];
const defO=()=>({fg:'#111827',bg:'#ffffff',shape:'sq',corner:0,margin:3,size:1200,logo:'',ls:22,lshape:'rd',lpad:1,top:'',bot:'',font:'sans-serif',fs:28});
let st={type:'web',d:{},o:defO(),editId:null,pi:-1,pr:'a4',cw:60,ch:40};

/* একটিই SVG রেন্ডারার: প্রিভিউ, ডাউনলোড ও প্রিন্ট সবই এটি থেকে */
function svg(pay,o){
 const q=qrcode(0,'H');q.addData(pay);q.make();const n=q.getModuleCount(),c=10,m=+o.margin,S=(n+2*m)*c;
 const hT=o.top?+o.fs*2:0,hB=o.bot?+o.fs*2:0,H=S+hT+hB,ox=m*c,oy=hT+m*c;
 let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${S} ${H}" width="${S}" height="${H}"><rect width="${S}" height="${H}" fill="${o.bg}"/>`;
 const fin=(r,k)=>(r<7&&k<7)||(r<7&&k>=n-7)||(r>=n-7&&k<7);
 for(let r=0;r<n;r++)for(let k=0;k<n;k++){if(fin(r,k)||!q.isDark(r,k))continue;const x=ox+k*c,y=oy+r*c;
  s+=o.shape=='dot'?`<circle cx="${x+5}" cy="${y+5}" r="4.2" fill="${o.fg}"/>`:o.shape=='rd'?`<rect x="${x}" y="${y}" width="10.2" height="10.2" rx="3.5" fill="${o.fg}"/>`:`<rect x="${x}" y="${y}" width="10.2" height="10.2" fill="${o.fg}"/>`}
 [[0,0],[0,n-7],[n-7,0]].forEach(([r,k])=>{const x=ox+k*c,y=oy+r*c,R=o.corner;
  s+=`<rect x="${x}" y="${y}" width="70" height="70" rx="${70*R*.5}" fill="${o.fg}"/><rect x="${x+10}" y="${y+10}" width="50" height="50" rx="${50*R*.5}" fill="${o.bg}"/><rect x="${x+20}" y="${y+20}" width="30" height="30" rx="${30*R*.5}" fill="${o.fg}"/>`});
 if(o.logo){const L=n*c*o.ls/100,cx=S/2,cy=oy+n*c/2,p=+o.lpad*c*.6,B=L+2*p;
  s+=`<rect x="${cx-B/2}" y="${cy-B/2}" width="${B}" height="${B}" rx="${o.lshape=='rd'?B/2:6}" fill="${o.bg}"/><clipPath id="lc"><rect x="${cx-L/2}" y="${cy-L/2}" width="${L}" height="${L}" rx="${o.lshape=='rd'?L/2:4}"/></clipPath><image href="${o.logo}" x="${cx-L/2}" y="${cy-L/2}" width="${L}" height="${L}" preserveAspectRatio="xMidYMid slice" clip-path="url(#lc)"/>`}
 const tx=(t,y)=>`<text x="${S/2}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-family="${o.font}" font-size="${o.fs}" font-weight="700" fill="${o.fg}">${esc(t)}</text>`;
 if(o.top)s+=tx(o.top,hT/2+m);if(o.bot)s+=tx(o.bot,H-hB/2-m);
 return s+'</svg>'}
const payload=()=>{const c=T[st.type];if(!c[2].some(f=>f[2]!='sel')||!st.d[c[2].find(f=>f[2]!='sel')[0]])return null;try{return c[3](st.d)}catch(e){return null}};
const cur=()=>{const p=payload();return p?svg(p,st.o):null};
function raster(sv,w,type,cb){const im=new Image();im.onload=()=>{const cv=document.createElement('canvas'),r=im.height/im.width;cv.width=w;cv.height=Math.round(w*r);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);cb(cv)};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sv)}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function dl(fmt,sv){sv=sv||cur();if(!sv)return toast('⚠️ অনুগ্রহ করে প্রয়োজনীয় তথ্য দিন।');
 if(fmt=='svg'){save(new Blob([sv],{type:'image/svg+xml'}),'qr.svg');return toast('✅ ছবি ডাউনলোড হয়েছে।')}
 const mt=fmt=='jpg'?'image/jpeg':'image/png';raster(sv,+st.o.size,mt,cv=>cv.toBlob(b=>{save(b,'qr.'+fmt);toast('✅ ছবি ডাউনলোড হয়েছে।')},mt,.95))}
